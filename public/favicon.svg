<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="innerDrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="none" stroke="#06B6D4" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Glowing Water Droplet -->
  <g filter="url(#glow)">
    <path d="M64 22 C64 22, 36 60, 36 80 C36 95.46 48.54 108 64 108 C79.46 108 92 95.46 92 80 C92 60, 64 22, 64 22 Z"
          fill="url(#drop)"/>
  </g>

  <!-- Inner highlight -->
  <path d="M64 28 C64 28, 42 62, 42 80 C42 92.15 51.85 102 64 102 C76.15 102 86 92.15 86 80 C86 62, 64 28, 64 28 Z"
        fill="url(#innerDrop)"/>

  <!-- Hydro-Wave Line -->
  <path d="M48 82 Q 56 76, 64 82 T 80 82" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
</svg>
